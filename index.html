<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria Slideshow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h2 class="icon">galleria.</h2>
        <button class="start">START SLIDESHOW</button>
    </header>

    <main class="gallery" id="gallery">

        <figure class="gallery-item">
            <img src="https://i.pinimg.com/736x/1c/30/c5/1c30c50a46ad1b00d597cd30e74427b2.jpg">
            <figcaption>
                <h2>Starry Night</h2>
                <p>Vincent Van Gogh</p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://i.pinimg.com/736x/46/b5/2d/46b52d79e1e8f3edc9be43defdf91df4.jpg">
            <figcaption>
                <h2>Girl with a Pearl Earring</h2>
                <p>Johannes Vermeer</p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://i.pinimg.com/1200x/ce/92/af/ce92af05f8791a86f3165bb08cd37b74.jpg">
            <figcaption>
                <h2>Guernica</h2>
                <p>Pablo Picasso</p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://i.pinimg.com/1200x/f9/93/49/f993490a4e33b6982876f4935b0e0fb1.jpg">
            <figcaption>
                <h2>Penitent Magdalene</h2>
                <p>Artemisia Gentileschi</p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://i.pinimg.com/1200x/b5/dc/5c/b5dc5c5a1d3096b690f7cc1186bfa815.jpg">
            <figcaption>
                <h2>The Storm on the Seo of Galilee</h2>
                <p>Rembrandt</p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://i.pinimg.com/1200x/94/5a/a9/945aa90e45f2cd694f456c10db9b5cbf.jpg">
            <figcaption>
                <h2>The Great Wave off Kanagawa</h2>
                <p>Hokusai</p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://i.pinimg.com/1200x/bd/a2/75/bda2759e1f73df78de1d53e464b6f854.jpg">
            <figcaption>
                <h2>Van Gogh self-portrait</h2>
                <p>Vincent van Gogh</p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://i.pinimg.com/1200x/86/a5/4f/86a54fe560aa4094f08a206d19bed6e7.jpg">
            <figcaption>
                <h2>The Sleeping Gypsy</h2>
                <p>Henri Rousseau</p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://i.pinimg.com/736x/d6/0a/a6/d60aa65b4536da1c5968e81e993b4512.jpg">
            <figcaption>
                <h2>Lady with an Ermin</h2>
                <p>Leanardo da Vinci</p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://i.pinimg.com/736x/12/d5/7e/12d57e7f4e443e69fd589eca5e1eca55.jpg">
            <figcaption>
                <h2>The Night Cafe</h2>
                <p>Vincent van Gogh</p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://i.pinimg.com/1200x/c3/1a/f5/c31af5d56cd3d038a3cf15f1d4d9d0ce.jpg">
            <figcaption>
                <h2>Mona Lisa</h2>
                <p>Leanardo da Vinci</p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://i.pinimg.com/1200x/8f/b9/68/8fb9688c92874acc7f6f2915d25fe38e.jpg">
            <figcaption>
                <h2>The Basket of Apples</h2>
                <p>Paul Cezanne</p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://i.pinimg.com/1200x/15/67/d4/1567d4eafe2701c13cb3e002e7bee40e.jpg">
            <figcaption>
                <h2>The Boy in the Red Vest</h2>
                <p>Edward Hopper</p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://i.pinimg.com/736x/70/3e/60/703e6091c19d50735e48508817002d54.jpg">
            <figcaption>
                <h2>Arnolfini Portrait</h2>
                <p>Jan van Eyck</p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://i.pinimg.com/1200x/6a/8d/53/6a8d53ff8b77ec24eb69b4dbb22a7b65.jpg">
            <figcaption>
                <h2>The Swing</h2>
                <p>Jean-Honore Fragonard</p>
            </figcaption>
        </figure>
    </main>

    <section class="slide hidden" id="slide">

        <div class="slide-left">
            <img class="main-img" id="slide-img">
            <a class="view-image" id="view-image" target="_blank">VIEW IMAGE</a>
            <div class="slide-title">
                <h2 id="slide-title"></h2>
                <p id="slide-artist"></p>
            </div>
        </div>

        <div class="slide-right">
            <span class="slide-year" id="slide-year"></span>
            <p class="slide-text" id="slide-text"></p>
            <a class="source" id="source" target="_blank">GO TO SOURCE</a>
        </div>

    </section>

    <footer class="footer hidden" id="footer">

        <div id="progress"></div>

        <div class="footer-row">
            <div>
                <h3 id="footer-title"></h3>
                <p id="footer-artist"></p>
            </div>

            <div>
                <button id="prev">&lt;</button>
                <button id="next">&gt;</button>                
            </div>

        </div>

    </footer>
    <script src="script.js"></script>
</body>
</html>
